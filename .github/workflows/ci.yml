name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # moon resolves changed files against the default branch; a shallow
          # clone has no 'main' ref and fails with git exit code 128.
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - run: moon run :lint :typecheck :test :build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Allow unprivileged user namespaces (Electron sandbox)
        # Ubuntu 24.04 runners restrict unprivileged userns via AppArmor, which
        # forces Electron onto the SUID chrome-sandbox (not setuid under bun's
        # store) and crashes on launch. Re-enabling userns keeps sandboxing on.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop smoke
        working-directory: apps/morphir-desktop
        env:
          MORPHIR_HOME: /tmp/morphir-home
        run: xvfb-run -a bun run smoke

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Package
        working-directory: apps/morphir-desktop
        shell: bash
        # Branch and pull-request artifacts belong to the unsigned developer-insider channel.
        # Production tags use release-desktop.yml, which requires signing and notarization.
        run: bun run package:developer-insider
      - uses: actions/upload-artifact@v4
        with:
          name: morphir-desktop-developer-insider-${{ matrix.os }}
          path: |
            apps/morphir-desktop/release/*.tar.gz
            apps/morphir-desktop/release/*.AppImage
            apps/morphir-desktop/release/*.deb
            apps/morphir-desktop/release/*.zip
            apps/morphir-desktop/release/*.dmg
            apps/morphir-desktop/release/*.exe
