appId: org.finos.morphir.desktop
productName: Morphir Desktop
copyright: Copyright © FINOS
executableName: morphir-desktop
artifactName: morphir-desktop-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
mac:
