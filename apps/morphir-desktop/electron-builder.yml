appId: org.finos.morphir.desktop
productName: Morphir Desktop
copyright: Copyright © FINOS
artifactName: morphir-desktop-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
mac:
  target:
    - zip
    - dmg
  category: public.app-category.developer-tools
  notarize: false
